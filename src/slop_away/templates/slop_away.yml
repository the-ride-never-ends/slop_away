name: slop_away

on: [push, pull_request]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install checks
        run: python -m pip install 'git+https://github.com/the-ride-never-ends/slop_away.git@@SLOP_REV@' 'pre-commit>=4,<5'
      - name: Check files
        run: pre-commit run --all-files
