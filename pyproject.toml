[project]
name = "slop_away"
version = "0.1.0"
description = "Check documentation and commit messages."
requires-python = ">=3.14,<3.15"
license = "MIT"
dependencies = [
    "markdown-it-py[linkify]>=4,<5",
    "mdit-py-plugins>=0.5,<1",
    "pathspec>=1,<2",
    "syllapy (>=0.7,<1)",
    "spacy (>=3.8.16,<3.9)",
    "en-core-web-sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl",
    "pyyaml (>=6,<7)",
    "regex (>=2025,<2027)",
]

[project.scripts]
slop_away = "slop_away.cli:main"

[tool.poetry]
packages = [{ include = "slop_away", from = "src" }]

[tool.poetry.group.dev.dependencies]
pytest = ">=9,<10"
pytest-bdd = ">=8.1,<10"
hypothesis = ">=6,<7"
pytest-cov = ">=7,<8"
pre-commit = ">=4,<5"


[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-config --strict-markers"
markers = [
    "fix_01: Fix feature scenario.",
    "fix_02: Fix feature scenario.",
    "fix_03: Fix feature scenario.",
    "fix_04: Fix feature scenario.",
    "fix_05: Fix feature scenario.",
    "fix_06: Fix feature scenario.",

    "sync_01: Package feature scenario.",
    "sync_02: Package feature scenario.",
    "sync_03: Package feature scenario.",
    "ait_01: Package feature scenario.",
    "ait_02: Package feature scenario.",
    "ait_03: Package feature scenario.",
    "ait_04: Package feature scenario.",
    "ait_05: Package feature scenario.",
    "ait_06: Package feature scenario.",
    "ait_07: Package feature scenario.",
    "ait_08: Package feature scenario.",
    "precommit_03: Package feature scenario.",

